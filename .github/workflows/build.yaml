name: Build and Publish to GHCR amd64

on:
  push:
    branches:
      - main
      - add-actions
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/news-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max